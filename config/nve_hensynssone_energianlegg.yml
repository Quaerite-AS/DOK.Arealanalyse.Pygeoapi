#
# ENDRET: bare `wms`, til tjenesten Geonorge-metadataen for 9f71a24b oppgir (kartkatalog, lest
# 2026-09-29 22:34Z): kart.nve.no/enterprise/services/Nettanlegg4/MapServer/WMSServer, med ETT
# lag. GetCapabilities der (1.3.0, 2026-09-29 22:31Z) har blant annet Distribusjonsnett,
# Regionalnett_luftledning46171 og Transmisjonsnett_luftledning43179, alle med LegendURL. Ingen
# av dem dekker hele EL_Luftlinje. Laget er Regionalnett_luftledning46171, fordi Regionalnett er
