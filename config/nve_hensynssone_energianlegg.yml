# Sørvestlandet, Vestland; wfs.nettanlegg GetFeature 2026-09-29 22:33Z). Kartet viser dermed ikke
# sentral- og distribusjonsnett. Treff og verdikt kommer fra WFS-en og påvirkes ikke av laget.
# Lagnavnet er ordrett fra kilden, med tallsuffikset.
