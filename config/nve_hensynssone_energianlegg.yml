# `wms` på nve.geodataonline.no/arcgis/services/Nettanlegg2 med TO lag (Distribusjonsnett,
# Regionalnett). Med flere lag slår motoren sammen tegnforklaringsbilder, og henter dem fra en
# vert som ikke finnes i DNS. Målt på quaerite-dok-motor-test 2026-09-29 22:32:56Z, fork
# ce97bbc: 20 × 20 m ved (37403.017, 6754168.360) traff EL_Luftlinje (runAlgorithm
