# Overstyrer kartverket/DOK.Arealanalyse.Config sin nve_faresone_skred_bratt_terreng.yml.
#
# HVORFOR: ArcGIS-transporten (nve.geodataonline.no/arcgis/.../Skredfaresoner1) svarer
# resultStatus=ERROR/HTTP 500 i produksjon (verifisert 2026-09-04, quaerite-platform#263 funn D).
# Beslutning (Håvard, 2026-09-04): bruk WFS. Uendret fra upstream: config_id, metadata_id
# (bevisst delt med nve_faresone_kvikkleireskred.yml — to fenomener under samme DOK-datasett hos
# DiBK), name, themes, result_status, planning_guidance_id, building_guidance_id, wms. Endret:
# transportlaget arcgis: → wfs:, og properties (se forbehold under).
#
# VERIFISERING (2026-09-04, live mot wfs.geonorge.no, egress kjørt utenfor denne sesjonen):
# - GetCapabilities: tjenesten wfs.skredfaresoner har EPSG:25833 i OtherCRS (DefaultCRS er 4258 —
#   srsName må settes eksplisitt). Lagnavn prefiks app:, navnerom
#   http://skjema.geonorge.no/SOSI/produktspesifikasjon/Skredfare/1.2.
# - Fire lag finnes: SkredFaresone (treffobjektet), SkredFaregrense, Analyseområde,
#   AnalyseområdeGr.
# - GetFeature bbox 80436,6931689,86436,6937689 (Stranda): SkredFaresone 5 features,
#   Analyseområde 2 features (talt i GML-bodyen — numberReturned rapporterte feilaktig "0" for
#   begge, kjent Geonorge-felle).
# - DescribeFeatureType/faktisk feature på app:SkredFaresone bekreftet: geometrifelt app:område
#   som gml:MultiSurface, srsName EPSG::25833. Attributter observert: app:identifikasjon
#   (lokalId, navnerom, versjonId — nøstet, ikke flatet ut i properties under),
#   app:datauttaksdato, app:datafangstdato, app:opphav.
# - Upstream sine properties (skredOmrID, vurdertStatSannsynlighet, KARTLEGGINGSDATO) ble IKKE
#   observert på den faktiske featuren og er derfor fjernet, ikke videreført blindt — erstattet
#   med de bekreftede feltene.
#
# DEKNING (oppgave 3): Analyseområde er BEKREFTET dekningslag — ikke bare ved treff i
# Stranda-bboxen (2 features), men ordrett fra NVEs egen DescribeFeatureType-annotasjon for
# objekttypen: «Selv om dette er landsdekkende data er ikke alle områder i landet analysert med
# tanke på skredfare. Hvilke områder som er ferdig analysert er gitt av data med objekttypen
# Analyseområde.» Attributter: område (Surface — geom_field), prosjektURL, rapportURL,
# identifikasjon, datafangstdato, førsteDigitaliseringsdato, datauttaksdato, oppdateringsdato,
# opphav — INGEN statuskode-attributt (annerledes enn Kartleggingsområde i wfs.kvikkleire, se
# forbeholdet i nve_faresone_kvikkleireskred.yml — der ER det en statuskode, kartleggingStatus,
# og nettopp derfor er dekning IKKE implementert der ennå: presence-semantikk ville vært en usann
# bekreftelse for et område med status «ikke ferdig kartlagt»). Her er situasjonen motsatt:
# Analyseområde har ingen statuskode i det hele tatt, så presence ER hele semantikken — det er
# NVEs egen definisjon, sitert over. Dekningen er derfor rendyrket presence-basert:
# `property` er satt til `opphav` UTELUKKENDE fordi pydantic-modellen CoverageBaseService i
# kartverket/DOK.Arealanalyse.Process (models/config/coverage_base_service.py) krever et
# `property`-felt som PEKER PÅ et reelt XML-element i featuren (coverage_wfs_response_parser.py
# hopper over featuren, og teller den dermed som ikke-dekket, hvis feltet mangler) — `opphav` er
# valgt fordi det ALLTID er populert på denne objekttypen, IKKE fordi verdien betyr noe. Selve
# innholdet i opphav (typisk «NVE») leses aldri opp mot noen terskel. `warning_threshold` er
# bevisst UTELATT — jf. coverage_quality.py, _get_coverage_quality_data: uten warning_threshold
# gir fravær av Analyseområde-treff automatisk «ikkeKartlagt», mens ethvert treff (uansett verdi
# på opphav) gir «Ja» (dekket). OBS ved fremtidig endring: hvis motoren noensinne innfører
# terskellogikk direkte på `property`-verdien (i stedet for kun tilstedeværelse), må dette
# oppsettet revurderes — `opphav` er ikke ment å bære mening, kun å eksistere.
