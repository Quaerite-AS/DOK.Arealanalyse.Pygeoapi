# Overstyrer kartverket/DOK.Arealanalyse.Config sin nve_faresone_skred_bratt_terreng.yml.
#
# HVORFOR: ArcGIS-transporten (nve.geodataonline.no/arcgis/.../Skredfaresoner1) svarer
# resultStatus=ERROR/HTTP 500 i produksjon (verifisert 2026-09-04, quaerite-platform#263 funn D).
# Beslutning (Håvard, 2026-09-04): bruk WFS. Uendret fra upstream: config_id, metadata_id
# (bevisst delt med nve_faresone_kvikkleireskred.yml — to fenomener under samme DOK-datasett hos
# DiBK), name, themes, result_status, planning_guidance_id, building_guidance_id, wms. Endret:
# transportlaget arcgis: → wfs:, og properties (se forbehold under).
#
# VERIFISERING (2026-09-04, live mot wfs.geonorge.no, egress kjørt utenfor denne sesjonen):
# - GetCapabilities: tjenesten wfs.skredfaresoner har EPSG:25833 i OtherCRS (DefaultCRS er 4258 —
#   srsName må settes eksplisitt). Lagnavn prefiks app:, navnerom
#   http://skjema.geonorge.no/SOSI/produktspesifikasjon/Skredfare/1.2.
# - Fire lag finnes: SkredFaresone (treffobjektet), SkredFaregrense, Analyseområde,
#   AnalyseområdeGr.
# - GetFeature bbox 80436,6931689,86436,6937689 (Stranda): SkredFaresone 5 features,
#   Analyseområde 2 features (talt i GML-bodyen — numberReturned rapporterte feilaktig "0" for
#   begge, kjent Geonorge-felle).
# - DescribeFeatureType/faktisk feature på app:SkredFaresone bekreftet: geometrifelt app:område
#   som gml:MultiSurface, srsName EPSG::25833. Attributter observert: app:identifikasjon
#   (lokalId, navnerom, versjonId — nøstet, ikke flatet ut i properties under),
#   app:datauttaksdato, app:datafangstdato, app:opphav.
# - Upstream sine properties (skredOmrID, vurdertStatSannsynlighet, KARTLEGGINGSDATO) ble IKKE
#   observert på den faktiske featuren og er derfor fjernet, ikke videreført blindt — erstattet
#   med de bekreftede feltene.
#
# DEKNING (oppgave 3): Analyseområde/AnalyseområdeGr ser ut som kandidat-dekningslag («området
# som er ferdig analysert for skredfare i bratt terreng») og ga 2 features i Stranda-bboxen —
# men attributtskjemaet (dekningStatus-lignende felt eller ren tilstedeværelse uten statuskode?)
# er IKKE verifisert. Ingen quality-blokk er derfor lagt til her. Dekning forblir `ukjent` for
# dette temaet inntil DescribeFeatureType er kjørt mot Analyseområde — håndteres på vår side
# (INV-R16).
