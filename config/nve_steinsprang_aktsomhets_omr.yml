# `wms` på nve.geodataonline.no, som ikke finnes i DNS (docs/DATAKILDER-dok-naturfare.md
# kap. 4). Geonorge-metadata for 02c6d51c oppgir
# kart.nve.no/enterprise/services/SkredSteinAktR/MapServer/WMSServer.
#
# TREFF-LAG (quaerite-platform#263 skive 6, GODKJENT av eieren 2026-09-30 09:13):
# upstream treffer på app:PotensieltSkredfareOmr, som er TOMT i wfs.steinsprang_aktsomhetsomrader
# (GetFeature uten bbox ga 0 flater, 2026-09-30 05:06Z). Temaet har derfor aldri kunnet gi treff.
# NVEs metadata for 02c6d51c sier at datasettet «består av flatetemaene UtlosningOmr og UtlopOmr»,
# og at det «ved bruk av datasettet til analyseformål bør ... som en hovedregel både
# utløsningsområder og utløpsområder benyttes sammen». Treff-lagene er derfor UtlosningOmr og
# UtlopOmr, i den rekkefølgen, hver med ett WMS-lag (Utlosningsomrade, Utlopsomrade; lest i
# GetCapabilities 2026-09-30 09:1xZ). Ett lag per oppføring unngår sammenslåtte tegnforklaringer
# (skive 3). Arealet i WFS-lagene er likt NVEs SkredSteinAktR lag 1 og 2 (#263, STEG 1 skive 6).
#
# properties: bare feltene begge lagene faktisk har (GetFeature, 20 objekter per lag,
# 2026-09-30): skredType og temaKvalitet. skredfareVurdering og oppdateringsdato finnes ikke i
# lagene og er tatt ut, så motoren ikke leverer tomme felt.
# result_status og guidance-id-ene er upstream ordrett.
